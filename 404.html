:root{color-scheme:only light;--paper:#FFFFFF;--ink:#0D1411;--ink-2:#2E3A34;--muted:#55635B;--shelf:#E4E9E3;--peg:#C5CEC6;--line:#C9D1CA;--green:#0B5B3C;--green-deep:#07402A;--yellow:#FFD60A}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink)}
body{font-family:"Alexandria","Segoe UI",Tahoma,sans-serif;font-size:16.5px;line-height:1.9;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:60px 22px;background:var(--shelf) radial-gradient(#D5DCD6 1.2px,transparent 1.7px) 0 0/28px 28px;border-top:14px solid var(--green)}
.box{position:relative;max-width:480px;width:100%;background:var(--paper);border-radius:6px;padding:40px 30px 30px;transform:rotate(-1.4deg);box-shadow:0 1px 0 rgba(13,20,17,.08),0 26px 38px -22px rgba(13,20,17,.45)}
.box::before{content:"";position:absolute;top:-18px;inset-inline-start:50%;width:44px;height:32px;margin-inline-start:-22px;border-radius:5px;background:#F6F8F5;border:1.5px solid rgba(13,20,17,.5);box-shadow:0 4px 6px -4px rgba(13,20,17,.4)}
.mk{display:block;font-family:"Shoulders",sans-serif;font-weight:900;font-size:clamp(110px,34vw,170px);line-height:.8;direction:ltr;color:var(--ink);margin-bottom:14px}
.mk::before{content:"404"}
h1{font-family:"Lalezar","Alexandria",sans-serif;font-weight:400;font-size:clamp(1.7rem,6vw,2.2rem);margin:0 0 8px;line-height:1.35}
p{color:var(--ink-2);margin:0 0 22px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
a.btn{display:inline-flex;text-decoration:none;border-radius:9px;padding:12px 22px;font-weight:700;font-size:15.5px;line-height:1.4;border:2px solid var(--ink);color:var(--ink);background:var(--paper)}
a.btn.p{background:var(--ink);color:#fff;box-shadow:0 12px 18px -10px rgba(13,20,17,.6)}
a.btn:active{transform:translateY(2px)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.links{margin-top:24px;padding-top:16px;border-top:2px dashed var(--line);font-size:14.5px;color:var(--muted)}
.links a{color:var(--green);font-weight:600;text-underline-offset:4px}
</style>
</head>
<body>
