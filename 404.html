<title>الصفحة غير موجودة — قُرب</title>
<meta name="description" content="الرابط الذي فتحته غير موجود في موقع قُرب.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2314594A'/%3E%3Crect x='17' y='22' width='30' height='22' rx='5' fill='none' stroke='%23F0F3EE' stroke-width='3.2'/%3E%3Cpath d='M17 29h30' stroke='%23F0F3EE' stroke-width='4.4'/%3E%3Ccircle cx='48' cy='18' r='8' fill='%23C98A2B' stroke='%2314594A' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--ink:#0E1512;--ink-2:#28322D;--paper:#ECEFE9;--paper-2:#F7F8F4;--line:#C6CDBF;--pine:#14594A;--amber:#C98A2B;--muted:#67736C;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--paper);color:var(--ink);}
body{font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;font-size:16px;line-height:1.85;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;}
.box{max-width:520px;text-align:center;background:var(--paper-2);border:1px solid var(--line);
  border-radius:20px;padding:44px 32px;}
.mk{display:inline-block;width:46px;height:46px;border-radius:13px;background:var(--pine);position:relative;margin-bottom:20px;}
.mk::after{content:"";position:absolute;inset-inline-end:-5px;top:-5px;width:15px;height:15px;
  border-radius:50%;background:var(--amber);border:3px solid var(--paper-2);}
h1{font-family:"Readex Pro",sans-serif;font-size:26px;font-weight:700;margin:0 0 12px;line-height:1.4;}
p{color:var(--ink-2);margin:0 0 26px;}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
a.btn{display:inline-block;text-decoration:none;border-radius:100px;padding:12px 26px;font-weight:600;font-size:15px;
  border:1px solid var(--line);color:var(--ink-2);background:#fff;transition:.2s;}
a.btn.p{background:var(--pine);border-color:var(--pine);color:#F0F3EE;}
a.btn:hover{transform:translateY(-1px);}
a.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.links{margin-top:26px;font-size:14px;color:var(--muted);}
.links a{color:var(--pine);text-decoration:none;}
.links a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <main class="box">
    <span class="mk" aria-hidden="true"></span>
    <h1>ما لقينا هذي الصفحة</h1>
    <p>الرابط قد يكون قديمًا أو فيه خطأ إملائي. جرّب من هنا:</p>
    <div class="btns">
      <a class="btn p" href="/">الصفحة الرئيسية</a>
      <a class="btn" href="/guide.html">دليل التجهيز</a>
    </div>
    <div class="links">
      أو <a href="/blog.html">المدونة</a> ·
      <a href="https://qurb-app.vercel.app/login">دخول لوحة التحكم</a> ·
      <a href="https://t.me/qurb_sa" target="_blank" rel="noopener">تواصل معي</a>
    </div>
  </main>
</body>
</html>
